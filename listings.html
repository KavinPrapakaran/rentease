<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Rentals – RentEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{--primary:#FF4D00;--secondary:#0A0A0A;--bg:#F5F3EF;--bg2:#EDEBE5;--white:#fff;--text:#1a1a1a;--text-light:#666;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
    h1,h2,h3,h4{font-family:'Syne',sans-serif}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:68px;background:rgba(10,10,10,.97);backdrop-filter:blur(16px)}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-icon{width:34px;height:34px;background:var(--primary);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
    .logo span{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:#fff}
    .logo span em{color:var(--primary);font-style:normal}
    .nav-right{display:flex;gap:12px;align-items:center}
    .btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:#fff;padding:8px 18px;border-radius:50px;font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;text-decoration:none}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
    .btn-primary{background:var(--primary);border:none;color:#fff;padding:9px 20px;border-radius:50px;font-size:.85rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .2s}
    .page-header{background:var(--secondary);padding:100px 5% 48px}
    .page-header h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:10px}
    .page-header p{color:rgba(255,255,255,.5);font-size:.95rem}
    .listings-page{padding:36px 5%;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:260px 1fr;gap:32px}
    .sidebar-filters{position:sticky;top:88px;height:fit-content}
    .filter-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:0 2px 16px rgba(0,0,0,.07);margin-bottom:16px}
    .filter-card h4{font-size:.95rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bg2)}
    .filter-group{margin-bottom:14px}
    .filter-group label{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--text);cursor:pointer;padding:6px 0}
    .filter-group input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
    .price-range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .price-range input{flex:1 1 110px;min-width:0;border:1.5px solid var(--bg2);border-radius:8px;padding:9px 11px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none}
    .price-range input:focus{border-color:var(--primary)}
    .price-range span{color:var(--text-light);font-size:.85rem}
    .btn-apply{width:100%;background:var(--primary);color:#fff;border:none;padding:11px;border-radius:9px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
    .results-header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
    .results-header p{font-size:.9rem;color:var(--text-light)}
    .listing-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
    .search-input{min-width:260px;border:1.5px solid var(--bg2);border-radius:10px;padding:10px 14px;font-size:.9rem;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);outline:none}
    .search-input:focus{border-color:var(--primary)}
    .sort-select{border:1.5px solid var(--bg2);border-radius:8px;padding:9px 14px;font-size:.85rem;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);outline:none;cursor:pointer}
    .sort-select:focus{border-color:var(--primary)}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
    .rental-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);transition:all .3s;cursor:pointer}
    .rental-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.13)}
    .card-img{position:relative;height:190px;overflow:hidden;background:var(--bg2)}
    .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .rental-card:hover .card-img img{transform:scale(1.05)}
    .card-badge{position:absolute;top:10px;left:10px;background:#22c55e;color:#fff;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:50px;text-transform:uppercase}
    .card-badge.booked{background:#f59e0b}
    .card-heart{position:absolute;top:10px;right:10px;width:32px;height:32px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;transition:all .2s}
    .card-heart:hover{background:#fff}
    .card-heart i{color:var(--text-light)}
    .card-body{padding:16px 18px}
    .card-body h4{font-size:.97rem;font-weight:700;margin-bottom:4px}
    .card-loc{display:flex;align-items:center;gap:4px;color:var(--text-light);font-size:.8rem;margin-bottom:10px}
    .card-loc i{color:var(--primary);font-size:.75rem}
    .card-rate{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--text-light);margin-bottom:12px}
    .card-rate .s{color:#FFB800}
    .card-rate strong{color:var(--text)}
    .card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--bg2)}
    .card-price strong{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;color:var(--primary)}
    .card-price span{font-size:.76rem;color:var(--text-light)}
    .btn-bk{background:var(--secondary);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
    .btn-bk:hover{background:var(--primary)}
    .empty-state{grid-column:1/-1;background:var(--white);border-radius:var(--radius);padding:32px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.06);color:var(--text-light)}
    .empty-state i{font-size:2rem;color:var(--primary);margin-bottom:10px;display:block}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--secondary);color:#fff;padding:13px 20px;border-radius:12px;font-size:.88rem;display:flex;align-items:center;gap:8px;z-index:300;transform:translateY(60px);opacity:0;transition:all .3s;box-shadow:0 8px 28px rgba(0,0,0,.2)}
    .toast.show{transform:translateY(0);opacity:1}
    .toast i{color:var(--primary)}
    @media(max-width:900px){.listings-page{grid-template-columns:1fr}.sidebar-filters{position:static}.search-input{min-width:0;flex:1}.price-range input{flex-basis:calc(50% - 4px)}}
  </style>
</head>
<body>
<div class="page-header">
  <h1>Browse All Rentals</h1>
  <p>Explore 40 verified listings across bikes, cars, laptops and cameras.</p>
</div>
<div class="listings-page">
  <!-- FILTERS -->
  <div class="sidebar-filters">
    <div class="filter-card">
      <h4><i class="fas fa-sliders-h" style="color:var(--primary);margin-right:7px"></i>Filters</h4>
      <div style="margin-bottom:16px">
        <div style="font-size:.8rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Category</div>
        <div class="filter-group"><label><input type="checkbox" checked value="bike" class="category-filter"/> <i class="fas fa-motorcycle" style="color:#FF6B35"></i> Bikes (10)</label></div>
        <div class="filter-group"><label><input type="checkbox" checked value="car" class="category-filter"/> <i class="fas fa-car" style="color:#2196F3"></i> Cars (10)</label></div>
        <div class="filter-group"><label><input type="checkbox" checked value="laptop" class="category-filter"/> <i class="fas fa-laptop" style="color:#2E7D32"></i> Laptops (10)</label></div>
        <div class="filter-group"><label><input type="checkbox" checked value="camera" class="category-filter"/> <i class="fas fa-camera" style="color:#F57C00"></i> Cameras (10)</label></div>
      </div>
      <div style="margin-bottom:16px">
        <div style="font-size:.8rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Price / Day</div>
        <div class="price-range"><input type="number" placeholder="Min ₹"/><span>to</span><input type="number" placeholder="Max ₹"/></div>
      </div>
      <div style="margin-bottom:16px">
        <div style="font-size:.8rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Availability</div>
        <div class="filter-group"><label><input type="checkbox" checked/> Available Now</label></div>
        <div class="filter-group"><label><input type="checkbox"/> Coming Soon</label></div>
      </div>
      <div>
        <div style="font-size:.8rem;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Rating</div>
        <div class="filter-group"><label><input type="checkbox"/> 4.5+ Stars ⭐</label></div>
        <div class="filter-group"><label><input type="checkbox"/> 4+ Stars ⭐</label></div>
      </div>
      <button class="btn-apply" onclick="showToast('Filters applied!')">Apply Filters</button>
    </div>
  </div>
  <!-- RESULTS -->
  <div>
    <div class="results-header">
      <p id="resultsSummary">Showing <strong>40</strong> results</p>
      <div class="listing-tools">
        <input id="searchInput" class="search-input" type="search" placeholder="Search by item, city, or category…"/>
        <select id="sortSelect" class="sort-select"><option value="relevance">Sort: Relevance</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="rating-desc">Best Rated</option><option value="title-asc">Name: A to Z</option></select>
      </div>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>
<script src="navbar.js"></script>

    {title:'Canon EOS R6 Mark II', category:'camera', icon:'fa-camera', price:1599, rating:4.9, reviews:79, location:'T. Nagar, Chennai', status:'Available', image:'https://images.unsplash.com/photo-1502189562704-87e62fa4c8a7?w=400&q=80'}
  ];

  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const cardsGrid = document.getElementById('cardsGrid');
  const resultsSummary = document.getElementById('resultsSummary');
  const categoryFilters = Array.from(document.querySelectorAll('.category-filter'));
  const categoryCounts = catalog.reduce((counts, item) => {
    counts[item.category] = (counts[item.category] || 0) + 1;
    return counts;
  }, {});

  function categoryLabel(category){
    return category === 'bike' ? 'Bikes' : category === 'car' ? 'Cars' : category === 'laptop' ? 'Laptops' : 'Cameras';
  }

  function stars(rating){
    const full = Math.round(rating);
    return '★★★★★'.slice(0, full).padEnd(5, '☆');
  }

  function currentFilters(){
    const enabledCategories = categoryFilters.filter(input => input.checked).map(input => input.value);
    const term = searchInput.value.trim().toLowerCase();
    return {enabledCategories, term, sort: sortSelect.value};
  }

  function filteredCatalog(){
    const filters = currentFilters();
    const results = catalog.filter(item => {
      const matchesCategory = filters.enabledCategories.includes(item.category);
      const text = [item.title, item.location, categoryLabel(item.category), item.status].join(' ').toLowerCase();
      const matchesText = !filters.term || text.includes(filters.term);
      return matchesCategory && matchesText;
    });

    switch (filters.sort) {
      case 'price-asc':
        results.sort((a, b) => a.price - b.price);
        break;
      case 'price-desc':
        results.sort((a, b) => b.price - a.price);
        break;
      case 'rating-desc':
        results.sort((a, b) => b.rating - a.rating || a.price - b.price);
        break;
      case 'title-asc':
        results.sort((a, b) => a.title.localeCompare(b.title));
        break;
    }

    return results;
  }

  function renderCards(){
    const items = filteredCatalog();
    resultsSummary.innerHTML = `Showing <strong>${items.length}</strong> of <strong>${catalog.length}</strong> results`;

    if (!items.length) {
      cardsGrid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>No rentals found</h3><p>Try a different search term or re-enable a category filter.</p></div>';
      return;
    }

    cardsGrid.innerHTML = items.map(item => `
      <div class="rental-card" data-category="${item.category}" data-title="${item.title.toLowerCase()}">
        <div class="card-img">
          <img src="${item.image}" alt="${item.title}"/>
          <span class="card-badge ${item.status === 'Booked' ? 'booked' : ''}">${item.status}</span>
          <div class="card-heart"><i class="fas fa-heart"></i></div>
        </div>
        <div class="card-body">
          <h4>${item.title}</h4>
          <div class="card-loc"><i class="fas fa-map-marker-alt"></i> ${item.location}</div>
          <div class="card-rate"><span class="s">${stars(item.rating)}</span><strong>${item.rating.toFixed(1)}</strong><span>(${item.reviews})</span></div>
          <div class="card-foot">
            <div class="card-price"><strong>₹${item.price}</strong><span>/day</span></div>
            <button class="btn-bk" onclick="showToast('${item.status === 'Booked' ? 'Currently booked' : 'Sign in to book!'}')">${item.status === 'Booked' ? 'Notify Me' : 'Book Now'}</button>
          </div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.card-heart').forEach(heart => {
      heart.addEventListener('click', function (event) {
        event.stopPropagation();
        const icon = this.querySelector('i');
        icon.style.color = icon.style.color ? '' : 'var(--primary)';
        showToast(icon.style.color ? 'Added to wishlist ♥' : 'Removed from wishlist');
      });
    });
  }

  function syncSidebarCounts(){
    categoryFilters.forEach(input => {
      const count = categoryCounts[input.value] || 0;
      const label = input.closest('label');
      if (label) {
        const textNode = label.childNodes[label.childNodes.length - 1];
        if (textNode && textNode.nodeType === Node.TEXT_NODE) {
          textNode.textContent = ` ${input.value === 'bike' ? 'Bikes' : input.value === 'car' ? 'Cars' : input.value === 'laptop' ? 'Laptops' : 'Cameras'} (${count})`;
        }
      }
    });
  }

  let t;
  function showToast(msg){
    clearTimeout(t);
    document.getElementById('toastMsg').textContent=msg;
    document.getElementById('toast').classList.add('show');
    t=setTimeout(()=>document.getElementById('toast').classList.remove('show'),3000);
  }

  categoryFilters.forEach(input => input.addEventListener('change', renderCards));
  searchInput.addEventListener('input', renderCards);
  sortSelect.addEventListener('change', renderCards);

  syncSidebarCounts();

  const initialCategory = new URLSearchParams(window.location.search).get('cat');
  if (initialCategory && categoryFilters.some(input => input.value === initialCategory)) {
    categoryFilters.forEach(input => {
      input.checked = input.value === initialCategory;
    });
  }

  renderCards();
</script>
</body>
</html>
